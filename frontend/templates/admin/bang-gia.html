<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bảng giá và tồn kho | Quản trị PeanutGear</title>
    <link rel="icon" th:href="@{/images/drx.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="admin-body">
<div class="admin-layout">
    <aside th:replace="~{fragments :: adminSidebar('san-pham')}"></aside>
    <main class="admin-main">
        <div class="admin-head">
            <h1>Bảng giá và tồn kho</h1>
            <a class="btn-sm" th:href="@{/admin/khuyen-mai}">Quản lý mã giảm giá</a>
            <a class="btn-sm" th:href="@{/admin/san-pham}">Danh sách sản phẩm</a>
        </div>
        <form class="inline-row" method="get" th:action="@{/admin/san-pham/bang-gia}">
            <label>Tra cứu sản phẩm <input type="search" name="q" th:value="${q}" placeholder="Mã, tên hoặc thương hiệu"></label>
            <label>Tồn kho
                <select name="ton">
                    <option value="">Tất cả</option>
                    <option value="con" th:selected="${ton == 'con'}">Còn hàng</option>
                    <option value="sap-het" th:selected="${ton == 'sap-het'}">Sắp hết (1–5)</option>
                    <option value="het" th:selected="${ton == 'het'}">Hết hàng</option>
                </select>
            </label>
            <button class="btn-sm" type="submit">Tra cứu</button>
            <a th:if="${!q.isEmpty() or !ton.isEmpty()}" th:href="@{/admin/san-pham/bang-gia}">Xóa bộ lọc</a>
        </form>
        <div class="table-wrap">
            <table class="table">
                <thead><tr><th>Mã</th><th>Sản phẩm</th><th>Giá niêm yết</th><th>Giá đang bán</th><th>Khuyến mãi</th><th>Tồn kho</th><th></th></tr></thead>
                <tbody>
                    <tr th:each="sp : ${sanPhams}" th:with="km=${sp.khuyenMaiHienTai}">
                        <td th:text="${sp.maSanPham}"></td>
                        <td><strong th:text="${sp.tenSanPham}"></strong> <span class="tag" th:unless="${sp.trangThai}">Đang ẩn</span></td>
                        <td th:text="|${#numbers.formatDecimal(sp.giaCoBan, 0, 'POINT', 0, 'COMMA')} ₫|"></td>
                        <td th:text="|${#numbers.formatDecimal(sp.giaBan, 0, 'POINT', 0, 'COMMA')} ₫|"></td>
                        <td th:text="${km == null ? '—' : km.ten + ' (' + km.phanTram + '%)'}"></td>
                        <td><span th:text="${sp.soLuongTon ?: 0}"></span> <span th:if="${sp.datTruocDuoc}" class="tag tag-blue">Nhận đặt trước</span></td>
                        <td><a class="btn-sm" th:href="@{/admin/san-pham/bang-gia/{id}(id=${sp.idSanPham})}">Quản lý giá</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sanPhams)}"><td colspan="7">Không tìm thấy sản phẩm.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
