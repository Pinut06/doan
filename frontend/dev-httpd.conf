Listen 127.0.0.1:3000
ServerName 127.0.0.1:3000
PidFile "${PEANUT_RUNTIME}/peanutgear-frontend.pid"
ErrorLog "${PEANUT_RUNTIME}/peanutgear-frontend-error.log"

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

DocumentRoot "${PEANUT_FRONTEND}/static"
<Directory "/">
    Require all denied
</Directory>
<Directory "${PEANUT_FRONTEND}/static">
    Options None
    AllowOverride None
    Require all granted
</Directory>

# Serve existing frontend assets directly. Spring resolves uploaded images and pages.
SetEnvIfExpr "-f '${PEANUT_FRONTEND}/static%{REQUEST_URI}'" no-proxy=1
ProxyPreserveHost On
ProxyPass        "/" "http://127.0.0.1:8082/"
ProxyPassReverse "/" "http://127.0.0.1:8082/"
