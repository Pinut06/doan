<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu | PeanutGear</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/images/drx.png}">
</head>
<body>

    <div th:replace="~{fragments :: shopHeader}"></div>

    <main class="container auth-main">
        <form class="auth-card" th:action="@{/quen-mat-khau}" method="post">
            <h1>Khôi phục mật khẩu</h1>

            <div class="alert alert-err" th:if="${loi}" th:text="${loi}"></div>
            
            <label>Tên đăng nhập
                <input type="text" name="tenDangNhap" th:value="${tenDangNhap}" required autofocus>
            </label>
            
            <label>Email đăng ký
                <input type="email" name="email" th:value="${email}" required>
            </label>
            
            <label>Mật khẩu mới
                <input type="password" name="matKhauMoi" required>
            </label>
            
            <label>Nhập lại mật khẩu mới
                <input type="password" name="nhapLaiMatKhauMoi" required>
            </label>
            
            <button type="submit" class="btn full">Xác nhận đổi mật khẩu</button>
            
            <p class="auth-switch">
                <a th:href="@{/login}">Quay lại đăng nhập</a>
            </p>
        </form>
    </main>

    <div th:replace="~{fragments :: shopFooter}"></div>
</body>
</html>
