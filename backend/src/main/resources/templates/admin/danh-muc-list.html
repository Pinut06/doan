<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh mục | Quản trị PeanutGear</title>
    <link rel="icon" type="image/png" th:href="@{/images/drx.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="admin-body">
    <div class="admin-layout">
        <aside th:replace="~{fragments :: adminSidebar('danh-muc')}"></aside>

        <main class="admin-main">
            <div class="admin-head">
                <h1>Danh mục</h1>
                <a class="btn" th:href="@{/admin/danh-muc/new}">+ Thêm danh mục</a>
            </div>

            <div th:replace="~{fragments :: flash}"></div>

            <div class="table-wrap">
                <table class="table">
                    <thead><tr><th>ID</th><th>Tên danh mục</th><th>Mô tả</th><th></th></tr></thead>
                    <tbody>
                        <tr th:each="dm : ${danhMucs}">
                            <td th:text="${dm.idDanhMuc}">1</td>
                            <td><strong th:text="${dm.tenDanhMuc}">Tên</strong></td>
                            <td th:text="${dm.moTa}">Mô tả</td>
                            <td class="actions">
                                <a class="btn-sm" th:href="@{/admin/danh-muc/{id}/edit(id=${dm.idDanhMuc})}">Sửa</a>
                                <form th:action="@{/admin/danh-muc/{id}/delete(id=${dm.idDanhMuc})}" method="post"
                                      onsubmit="return confirm('Xóa danh mục này?');">
                                    <button type="submit" class="btn-sm danger">Xóa</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <p class="empty-note" th:if="${#lists.isEmpty(danhMucs)}">Chưa có danh mục nào.</p>
            </div>
        </main>
    </div>
</body>

</html>
