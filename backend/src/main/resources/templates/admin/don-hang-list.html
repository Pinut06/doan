<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đơn hàng | Quản trị PeanutGear</title>
    <link rel="icon" type="image/png" th:href="@{/images/drx.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside th:replace="~{fragments :: adminSidebar('don-hang')}"></aside>
        <main class="admin-main">
            <div class="admin-head"><h1>Đơn hàng</h1></div>
            <a class="btn" th:href="@{/admin/don-hang/new}">Tạo đơn hàng</a>
            <a class="btn-sm" th:href="@{/admin/thanh-toan}">Thanh toán và công nợ</a>
            <a class="btn-sm" th:href="@{/admin/giao-hang}">Quản lý giao hàng</a>
            <a class="btn-sm" th:href="@{/admin/doi-tra}">Quản lý đổi trả</a>
            <a class="btn-sm" th:href="@{/admin/hoa-don}">Quản lý hóa đơn</a>
            <div th:replace="~{fragments :: flash}"></div>
            <form th:replace="~{fragments :: traCuuDon(@{/admin/don-hang})}"></form>
            <div class="table-wrap">
                <table class="table">
                    <thead><tr><th>Mã đơn</th><th>Ngày</th><th>Khách</th><th>Loại</th><th>Tổng</th><th>Thanh toán</th><th>Trạng thái</th><th></th></tr></thead>
                    <tbody>
                        <tr th:each="dh : ${donHangs}">
                            <td><strong th:text="${dh.maDon}">PG</strong></td>
                            <td th:text="${#temporals.format(dh.ngayTao, 'dd/MM/yyyy HH:mm')}">d</td>
                            <td><span th:text="${dh.hoTenNhan}">n</span><br><span class="muted" th:text="${dh.khachHang.tenDangNhap}">u</span></td>
                            <td><span class="tag tag-blue" th:if="${dh.datTruoc}">Đặt trước</span>
                                <span class="tag" th:unless="${dh.datTruoc}">Thường</span></td>
                            <td th:text="${#numbers.formatDecimal(dh.tongTien, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0</td>
                            <td><span class="tag tag-green" th:if="${dh.daThanhToan}" th:text="${dh.nhanThanhToan}"></span>
                                <span class="tag tag-yellow" th:unless="${dh.daThanhToan}" th:text="${dh.nhanThanhToan}"></span>
                                <div class="muted" th:text="${dh.phuongThuc.nhan}">pt</div></td>
                            <td><span class="tag" th:classappend="${dh.trangThai.mau}" th:text="${dh.trangThai.nhan}">st</span></td>
                            <td><a class="btn-sm" th:href="@{/admin/don-hang/{id}(id=${dh.idDonHang})}">Chi tiết</a></td>
                        </tr>
                    </tbody>
                </table>
                <p class="empty-note" style="padding:16px" th:if="${#lists.isEmpty(donHangs)}">Chưa có đơn hàng.</p>
            </div>
        </main>
    </div>
</body>
</html>
