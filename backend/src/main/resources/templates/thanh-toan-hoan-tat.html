<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanh toán thành công | PeanutGear</title>
    <link rel="icon" type="image/png" th:href="@{/images/drx.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .success-wrapper {
            max-width: 600px;
            margin: 40px auto 60px;
            text-align: center;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
            box-shadow: 0 0 0 10px #f0fdf4;
            animation: popIn 0.5s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .success-subtitle {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 28px;
        }
        .order-summary-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            margin-bottom: 30px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }
        .summary-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .summary-row.highlight {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0891b2;
            border-top: 1px solid #cbd5e1;
            margin-top: 8px;
            padding-top: 12px;
        }
        .actions-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-outline {
            display: inline-block;
            background: #ffffff;
            color: #0f172a;
            font-weight: 600;
            padding: 10px 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments :: shopHeader}"></div>

    <main class="container page-main">
        <div class="success-wrapper">
            <div class="success-icon">✓</div>
            <h1 class="success-title">Thanh toán hoàn tất!</h1>
            <p class="success-subtitle">Cửa hàng đã ghi nhận đủ thanh toán cho đơn hàng.</p>

            <div class="order-summary-box">
                <div class="summary-row">
                    <span class="muted">Mã đơn hàng:</span>
                    <strong style="color: #0f172a;" th:text="${donHang.maDon}">PG000001</strong>
                </div>
                <div class="summary-row">
                    <span class="muted">Trạng thái thanh toán:</span>
                    <span class="tag tag-green" th:text="${donHang.nhanThanhToan}">Đã thanh toán</span>
                </div>
                <div class="summary-row">
                    <span class="muted">Người nhận:</span>
                    <span th:text="${donHang.hoTenNhan}">Khách hàng</span>
                </div>
                <div class="summary-row">
                    <span class="muted">Số điện thoại:</span>
                    <span th:text="${donHang.soDienThoai}">090...</span>
                </div>
                <div class="summary-row">
                    <span class="muted">Địa chỉ nhận hàng:</span>
                    <span th:text="${donHang.diaChi}">Địa chỉ</span>
                </div>
                <div class="summary-row highlight">
                    <span>Số tiền đã thanh toán:</span>
                    <span th:text="${#numbers.formatDecimal(donHang.thucThu, 1, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</span>
                </div>
            </div>

            <div class="actions-group">
                <a class="btn" th:href="@{/don-hang/{id}(id=${donHang.idDonHang})}">Xem chi tiết đơn hàng</a>
                <a class="btn-outline" th:href="@{/don-hang}">Danh sách đơn hàng</a>
                <a class="btn-outline" th:href="@{/}">Tiếp tục mua sắm</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments :: shopFooter}"></div>
</body>
</html>
