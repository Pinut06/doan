spring.application.name=phukien

# ===============================
# DATABASE MYSQL (tự tạo database nếu chưa có)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/doan?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE (update: tự tạo/cập nhật bảng)
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# UPLOAD ẢNH
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===============================
# SERVER
# ===============================
server.port=8082
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

